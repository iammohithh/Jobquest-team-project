<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobQuest</title>
    <link rel="stylesheet" href="hero.css">
</head>
<body>
    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <!-- LOGO -->
        <div class="logo">
                     <div class="logo1"><img src="images/logo.png" alt=""></div>
            JobQuest
        </div>

        <!-- NAVIGATION -->
        <nav>
            <a href="#">Home</a>
            <a href="#">Jobs</a>
            <a href="#">Companies</a>
            <a href="#">Community</a>
        </nav>

        <!-- RIGHT SIDE -->
        <div class="nav-right">

            <!-- SEARCH -->
            <button class="search-btn">🔍</button>

            <!-- APPLY BUTTON -->
            <button class="apply-btn">Apply Today</button>
        </div>
    </header>
    <!-- ================= HERO SECTION ================= -->
    <section class="hero">
        <!-- LEFT SIDE -->
        <div class="hero-content">
            <p class="small-text">Find Your Match</p><br><br>
            <h1>Unlock Your Next<br>Career Move</h1>
            <!-- lines -->
               <img src="images/image1.png" alt="" class="lines">

                <p class="hero-description">
                Explore thousands of opportunities tailored to your
                skills and experience. Connect with top employers
                and take the next step in your career journey
                with confidence.</p>


            <!-- EMAIL -->
            <div class="email-box">
                <input type="email" placeholder="Your email address">
                <button>Get Started</button>
            </div>

            <!-- TRUST -->
            <div class="members">
                <div class="p-images">
                    <img src="images/user1.png" alt="users">
                    <img src="images/user2.png" alt="users">
                    <img src="images/user3.png" alt="users">
                </div>
                <div class="rating">
                <div class="stars">⭐⭐⭐⭐⭐</div>
                <p>Trusted by 10,000+ job seekers</p>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE IMAGE -->
        <div class="hero-image">

            <img src="images/image.png" alt="Woman working on laptop">
        </div>
    </section>

</body>
</html>
