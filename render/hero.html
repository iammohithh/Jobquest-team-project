<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobQuest</title>
    <link rel="stylesheet" href="../hero-section/hero.css">
<link rel="stylesheet" href="../hero-section/hero.css"><style>html,body{width:100%;min-height:0;}body{overflow:hidden;} .navbar{height:75px;padding:3%;} .hero{min-height:600px;display:flex;flex-direction:row;text-align:left;padding:70px;align-items:center;} .hero-content{width:50%;max-width:600px;} .hero-image{width:50%;margin-top:0;} nav{order:initial;width:auto;justify-content:initial;} .nav-right{margin-left:0;} .members{justify-content:flex-start;} .hero h1{font-size:58px;} .hero-description{margin-left:0;margin-right:0;} .lines{margin-left:0;margin-right:0;} .email-box{margin-left:0;margin-right:0;}</style></head>
<body>
    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <!-- LOGO -->
        <div class="logo">
                     <div class="logo1"><img src="../hero-section/images/logo.png" alt=""></div>
            JobQuest
        </div>

        <!-- NAVIGATION -->
        <nav>
            <a href="#">Home</a>
            <a href="#">Jobs</a>
            <a href="#">Companies</a>
            <a href="#">Community</a>
        </nav>

        <!-- RIGHT SIDE -->
        <div class="nav-right">

            <!-- SEARCH -->
            <button class="search-btn">🔍</button>

            <!-- APPLY BUTTON -->
            <button class="apply-btn">Apply Today</button>
        </div>
    </header>
    <!-- ================= HERO SECTION ================= -->
    <section class="hero">
        <!-- LEFT SIDE -->
        <div class="hero-content">
            <p class="small-text">Find Your Match</p><br><br>
            <h1>Unlock Your Next<br>Career Move</h1>
            <!-- lines -->
               <img src="../hero-section/images/image1.png" alt="" class="lines">

                <p class="hero-description">
                Explore thousands of opportunities tailored to your
                skills and experience. Connect with top employers
                and take the next step in your career journey
                with confidence.</p>


            <!-- EMAIL -->
            <div class="email-box">
                <input type="email" placeholder="Your email address">
                <button>Get Started</button>
            </div>

            <!-- TRUST -->
            <div class="members">
                <div class="p-images">
                    <img src="../hero-section/images/user1.png" alt="users">
                    <img src="../hero-section/images/user2.png" alt="users">
                    <img src="../hero-section/images/user3.png" alt="users">
                </div>
                <div class="rating">
                <div class="stars">⭐⭐⭐⭐⭐</div>
                <p>Trusted by 10,000+ job seekers</p>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE IMAGE -->
        <div class="hero-image">

            <img src="../hero-section/images/image.png" alt="Woman working on laptop">
        </div>
    </section>

</body>
</html>
